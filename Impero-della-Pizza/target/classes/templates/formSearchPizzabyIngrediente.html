<!DOCTYPE html>
<html>
<head>
	<title>Cerca Pizza per Ingrediente</title>
	<link rel="stylesheet" href="/css/search.css" />
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>


	<h1>Cerca Pizza per Ingrediente</h1>
	<form th:action="@{/pizza/cercaPizza}" method="post">
		<div>
		  <span class="label">Ingrediente:</span>
		  <input type="text" name="nomeIngrediente" />
		  <span><button type="submit">Cerca</button></span>
		</div>

	</form>
</body>

</html>
