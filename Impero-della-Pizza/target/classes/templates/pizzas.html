<!DOCTYPE html>
<html>

	<head>
		<title>Lista Pizze</title>
	</head>	

	<body>
		<div>
			<a href="/"><img src = "/images/impero-della-pizza.png" width="5%"></a>
		</div>
		
		<h1>Le nostre Pizze</h1>
		
		<div th:if="${pizzas.isEmpty()}">Non ci sono pizze da gustare :(</div>
		<ul>
			<li th:each="pizza : ${pizzas}">
				<a th:href="@{'/pizza' + '/' + ${pizza.id}}" th:text="${pizza.nome} + ' (€' + ${pizza.prezzo} + ')'">Margherita (€ 5)</a>
			</li>
		</ul>
	</body>
	
	
</html>
