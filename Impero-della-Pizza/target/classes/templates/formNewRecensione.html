<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <title>Nuova Recensione</title>

    </head>

    <body>
        <header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
            <h1>Inviaci la tua recensione!</h1>
			<a href="/"><img src="/images/impero-della-pizza.png" width="5%"/></a>
            <nav>
                <a href="/">Home</a>
                <a href="/recensione">Recensioni</a>
            </nav>
        </header>

        <main>
			<form th:action="@{/recensione}" method="post" th:object="${recensione}">
			    <fieldset>
			        <legend>Recensione</legend>

			        <label> Descrizione:
			            <input type="text" name="descrizione" placeholder="Gnam!"
			                th:field="*{descrizione}"
						>
						<span th:if="${#fields.hasErrors('descrizione')}" th:errors="*{descrizione}"></span>
			        </label>

			        <label>Stelle:
			            <input type="number" min="0" max="5" name="stelle" placeholder="5/5"
			                th:field="*{stelle}"
						>
						<span th:if="${#fields.hasErrors('stelle')}" th:errors="*{stelle}"></span>
			        </label>
			        
			        <label>Data:
			            <input type="datetime" name="data" placeholder="2023-05-10"
			                th:field="*{dataCreazione}"
						>
						<span th:if="${#fields.hasErrors('dataCreazione')}" th:errors="*{dataCreazione}"></span>
			        </label>

			        <button>Submit</button>
			    </fieldset>
			</form>

        </main>
    </body>
</html>
