<!DOCTYPE html>
<html>
<head>
    <title>Lista Recensioni</title>
    <meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/recensione.css}" />
</head>
<body>
	<header>
	  <div class="logo">
	    <a href="/"><img src="/images/impero-della-pizza.png" width="70" alt="Logo" /></a>
	  </div>

	  <div class="user-area" th:if="${userDetails}">
	    <a class="username" th:href="@{'/recensione/' + ${userDetails.username} + '/recensioni'}" th:text="${userDetails.username}"></a>
	    <a href="/logout">Logout</a>
	  </div>

	  <div class="user-area" th:unless="${userDetails}">
	    <a href="/login">Login</a>
	  </div>
	</header>
    <h1>Tutte le Recensioni</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Pizza</th>
                <th>Descrizione</th>
                <th>Data</th>
                <th>Autore</th>
				<th>Stelle</th>
                <th>Dettagli</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="rec : ${recensioni}">
                <td th:text="${rec.id}">1</td>
                <td><a th:href="@{/pizza/{id}(id=${rec.pizza.id})}" th:text="${rec.pizza.nome}"></a></td>
                <td th:text="${rec.descrizione}">Descrizione</td>
                <td th:text="${rec.dataCreazione}">2024-04-01</td>
				<td> <a th:href="@{/recensione/{username}/recensioni(username=${rec.autore.username})}" th:text="${rec.autore.username}"></a></td>
                <td th:text="${rec.stelle}">4.5</td>
                <td><a th:href="@{/recensione/{id}(id=${rec.id})}">Visualizza</a></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
