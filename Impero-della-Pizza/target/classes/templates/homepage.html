<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="/images/logoPizza.png">
        <title>L'Impero della Pizza</title>
        <link rel="stylesheet" href="css/home.css">       
    </head>

    <body>
        <header>
            <nav class="navbar">
                <div class="nav-links">
                    <a href="/homepage"><img src="images/logoPizza.png" alt="logo" title="Home"
                        height="100" width="100" class="logo">
                    </a>               
                    <a href="/pizza">Menù</a>
                    <a href="/ingrediente">Ingredienti</a>
                    <a href="/recensione">Recensioni</a>
                </div>
                <div th:if="${userDetails}">
                    <span th:text="${userDetails.username}"></span>
                    <a href="/logout">Logout</a>
                </div>
                <div th:unless="${userDetails}">
                    <a href="/login">Login</a>
                </div>
            </nav>
        </header>

        <section class="richieste">
            <h1>Crea oggi stesso la tua pizza!</h1>
            <fieldset>
                <legend><h2>Le più amate</h2></legend>
                <div class="pizze">
                    <img src="/images/pizza-margherita.jpg" alt="Margherita">
                    <img src="/images/pizza-diavola.jpg" alt="Diavola">
                    <img src="/images/pizza-quattro-formaggi.jpg" alt="Boscaiola">
                </div>
            </fieldset>
            
        </section>

    </body>
</html>
