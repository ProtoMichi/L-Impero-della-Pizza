<!DOCTYPE html>
<html>
<head>
  <title>Ingrediente</title>
</head>
<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>
	<div>
				<a href="/"><img src="/images/impero-della-pizza.png" width="5%" /></a>
			</div>
	
  <div th:if="${ingrediente}">
    <h1 th:text="${ingrediente.nome}" style="text-decoration: none;color: brown;">Nome Ingrediente</h1>
  </div>
	<div>
	  Prezzo: <span th:text="${#numbers.formatDecimal(ingrediente.prezzo, 1, 2)} + ' €'">1.50 €</span>
	</div>
    <div th:if="${ingrediente.vegan}">
      <span><img src="/images/Vegan_friendly_icon.jpg" width="1.5%"></span>
    </div>
    <div th:if="${ingrediente.celiaco}">
     <img src="/images/GlutenFree.jpg" width="1.5%">
    </div>
	
	<div th:if="${ruolo == 'ADMIN'}">
			    <a th:href="@{'/ingrediente/' + ${ingrediente.id} + '/modifica'}">Modifica Ingrediente</a>
			  </div>
			  
  <div th:unless="${ingrediente}">
    Non Esiste
  </div>
</body>
</html>
