<!DOCTYPE html>
<html>

	<head>
		<title>Lista Pizze</title>
		<link rel="stylesheet" href="css/pizze.css">
	</head>	

	<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>
		<div>
			<a href="/"><img src = "/images/impero-della-pizza.png" width="5%"/></a>
		</div>
		
		<h1>Le nostre Pizze</h1>
		
		<h2> 
			<a href="/pizza/formCercaPizza">Cerchi qualche pizza con un ingrediente particolare?</a>
		</h2>
		
		<div th:if="${pizze.isEmpty()}">Non ci sono pizze da gustare :(</div>
		<ul>
			<li th:each="pizza : ${pizze}" style="font-size: 2rem">
				<a th:href="@{'/pizza' + '/' + ${pizza.id}}" th:text="${pizza.nome} +
				 ' (' + ${#numbers.formatDecimal(pizza.prezzo, 1, 2)} + '€)'" style="text-decoration: none;color: brown;">Margherita (€ 5)</a>
				<span th:if="${pizza.isCeliaco()}"> <img src="/images/GlutenFree.jpg" width="1.5%"/></span>
				<span th:if="${pizza.isVegan()}"> <img src="/images/Vegan_friendly_icon.jpg" width="1.5%"/></span>
				<span th:text="${pizza.calcolaMediaStelle()} + ' Stelle'"></span>
				<p style="font-size: 1.4rem">
					<span th:each="ingrediente : ${pizza.listaIngredienti}" th:text="${ingrediente.nome} + ' '"></span>
				</p>
				<div class="stelle" th:if="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}"
							th:with="media = ${pizza.calcolaMediaStelle()},
				    		piene = ${(T(java.lang.Math).floor(media)).intValue()},
				    		haMezza = ${(media - piene) >= 0.5},
				    		mezza = ${haMezza ? 1 : 0},
				    		vuote = ${5 - piene - mezza}">    		
				    		<img class="stella" src="/images/star-full.png" th:each="i : ${#numbers.sequence(1, piene)}"/>
				    		<img class="stella" src="/images/star-half.png" th:if="${haMezza}"/>
				    		<img class="stella" src="/images/star-empty.png" th:if="${vuote > 0}" th:each="i : ${#numbers.sequence(1, vuote)}"/>
						</div>
						<span th:text="${#numbers.formatDecimal(pizza.calcolaMediaStelle(), 1, 2)}" style="font-size: 2rem; color: #f1e4cd;
						 width: 100%; text-align: center; display: block; font-weight: bold;"></span>
						<div class="stelle" th:unless="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}">
				    		<span th:each="i : ${#numbers.sequence(1,5)}">
				        		<img class="stella" src="/images/star-empty.png"/>
				    		</span>
						</div>
					</div>
			</li>
		</ul>
	</body>
	
	
</html>
