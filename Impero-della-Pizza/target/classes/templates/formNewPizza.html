<!DOCTYPE html>
<html>
	
	<head>
		<title>Crea la tua pizza!</title>
	</head>

	<body>
		<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>
		<div><a href="/"><img src="/images/impero-della-pizza.png" width="5%"/></a> </div>
		
		<h1>Crea la tua pizza!</h1>
		<form th:action="@{/pizza}" method="POST" th:object="${pizza}">
			<div th:if="${#fields.hasGlobalErrors()}">
				<p th:each="err : ${#fields.globalErrors()}"th:text="${err}">...</p>
			</div>
			<div>
				<label>Nome:</label><span><input type = "text" th:field="${pizza.nome}"></span>
				<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
			</div>
			<div>
				<label>Prezzo: €</label> <span><input type="number" min="0" step="0.25" 
					th:field="${pizza.prezzo}"> </span> 
				<span th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}"></span>
			</div>
			<div>
				<label>URL Immagine:</label> <span><input type="text" th:field="${pizza.URLImmagine}" /></span>
			</div>
			<div>
				<span><button type = "submit">Conferma!</button></span>
			</div>
		</form>
	
	</body>
	
	
</html>
