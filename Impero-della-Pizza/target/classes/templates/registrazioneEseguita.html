<!DOCTYPE html>
<html>

<head>
	<title>Impero della Pizza - Registrazione Eseguita</title>
	<link rel="stylesheet" href="/css/goodSignIn.css" />
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<header>
			<nav class="navbar">
			    <div class="nav-links">
			        <a class="logo">
			            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
			                height="70" width="70" class="logo">
			        </a>               
			        <a href="/pizza">Menù</a>
			        <a href="/ingrediente">Ingredienti</a>
			        <a href="/recensione">Recensioni</a>
			        <a href="/formNewPizza">Crea</a>
			        <a href="/pizza/formCercaPizza">Cerca</a>
					<!-- Blocco utente -->
					
						<div th:if="${userDetails}">
							<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
							<a href="/logout">Logout</a>
						</div>
						<div th:unless="${userDetails}">
							<a href="/login">Login</a>
						</div>
					</div>
			</nav>
		</header>
	</header>
	
	<h1>Congratulazioni!</h1>
	<h2>Ora puoi degustare tutte le nostre leccornie!</h2>
	<div>
		<span>Nome:</span>
		<span th:text="${user.nome}"></span>
	</div>
	<div>
		<span>Cognome:</span>
		<span th:text="${user.cognome}"></span>
	</div>
	<div>
		<span>Email:</span>
		<span th:text="${user.email}"></span>
	</div>
</body>
</html>
