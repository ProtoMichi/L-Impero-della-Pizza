<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Pizza non trovata</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff5e6;
            text-align: center;
            padding: 50px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        #videoPlaceholder {
            margin-top: 30px;
        }

        #playButton {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 18px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #playButton:hover {
            background-color: #c9302c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Oops! 🍕</h1>
        <p>La pizza che stai cercando non esiste.</p>
        <a href="/pizza">Torna alla lista delle pizze</a>

        <div id="videoPlaceholder">
            <button id="playButton">▶️ Guarda il video</button>
        </div>
    </div>

    <!-- YouTube Player API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player;

        function onYouTubeIframeAPIReady() {
            // Prepariamo ma NON creiamo ancora il player (solo su clic)
        }

        document.getElementById("playButton").addEventListener("click", () => {
            const placeholder = document.getElementById("videoPlaceholder");
            placeholder.innerHTML = '<div id="ytPlayer"></div>';

            player = new YT.Player('ytPlayer', {
                height: '405',
                width: '720',
                videoId: '7kqYEEpvuok', // ID del video
                playerVars: {
                    autoplay: 1,
                    controls: 1
                },
                events: {
                    onReady: event => event.target.playVideo()
                }
            });
        });
    </script>
</body>
</html>
