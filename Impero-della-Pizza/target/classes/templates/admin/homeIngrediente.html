<!DOCTYPE html>
<html>
	<head>
		<title>
			Impero della Pizza - Gestione Ingrediente
		</title>
		<link rel="stylesheet" href="/css/stile.css" />
	</head>
<body>
	<header>
		<div th:if="${userDetails}">
			<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>

		<div><a href="/"><img src="/images/impero-della-pizza.png" width="15%"/></a></div>
		<h1>Gestione Ingredienti</h1>
		<div>
			<a href="/admin/formNewIngrediente">Inserisci un nuovo ingrediente</a>
		</div>
		<div>
			<a href="/ingrediente">Ingredienti</a>
		</div>
	</body>
</html>
