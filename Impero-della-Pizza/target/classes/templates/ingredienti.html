<!DOCTYPE html>
<html>
<head>
  <title>SIW</title>
</head>
<body>

  <h1>Ingredienti</h1>

  <div th:if="${ingredienti.isEmpty()}">
    Non ci sono Ingredienti nel sistema
  </div>

  <ul>
    <li th:each="ingrediente : ${ingredienti}">
      <a th:href="@{'/ingrediente/' + ${ingrediente.id}}">
        <span th:text="${ingrediente.nome}">Pomodoro</span>
        <span th:text="' ' + ${ingrediente.prezzo} + '€'">1.50€</span>
        <span th:if="${ingrediente.vegan}"> - Adatto a vegani</span>
        <span th:unless="${ingrediente.vegan}"> - Non adatto a vegani</span>
        <span th:if="${ingrediente.celiaco}"> - Adatto a celiaci</span>
        <span th:unless="${ingrediente.celiaco}"> - Non adatto a celiaci</span>
      </a>
    </li>
  </ul>
</body>
</html>
