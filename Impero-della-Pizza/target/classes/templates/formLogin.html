<!DOCTYPE html>
<html>

<head>
	<title>
		Impero della Pizza - Login
	</title>
	<link rel="stylesheet" href="/css/login.css"/>
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>
	
	<h1>Login</h1>
	<form th:action="@{/login}" method="POST">
		<div>
			<span>Username:</span>
			<span><input name="username" type="text" required/></span> 
		</div>
		<div>
			<span>Password:</span>
			<span><input name="password" type="password" required/></span> 
		</div>
		<div>
			<span th:if="${param.error != null}">Username e/o password errati!</span>
		</div>
		<div>
			<span><button type="submit">Login</button></span>
			<a th:href="@{/registrazione}" th:text="Registrati">Registrati</a>
		</div>
		
	</form>

</body>

</html>
