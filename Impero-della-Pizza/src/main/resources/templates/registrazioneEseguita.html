<!DOCTYPE html>
<html>

<head>
	<title>Imper della Pizza - Registrazione Eseguita</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${user}">
			<a href="/login">Login</a>
		</div>
	</header>
	
	<div>
		<a href="/"><img src="/images/impero-della-pizza.png" width="5%"/></a>
	</div>
	<h1>Congratulazioni, ora puoi dare un'occhiata a tutte le nostre leccornie!</h1>
	<div>
		<span>Nome:</span>
		<span th:text="${user.nome}"></span>
	</div>
	<div>
		<span>Cognome:</span>
		<span th:text="${user.cognome}"></span>
	</div>
	<div>
	<span>Email:</span>
		<span th:text="${user.email}"></span>
	</div>
</body>
</html>
