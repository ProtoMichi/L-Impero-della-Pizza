<!DOCTYPE html>
<html>

	<head>
		<title>Lista Pizze</title>
		<link rel="stylesheet" href="/css/pizze.css">
		<link rel="stylesheet" href="/css/navbar.css">
	</head>	

	<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo" href="/">
		            <img src="images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>
		
		
		<h1>Le nostre Pizze</h1>
		
		<h2> 
			<a href="/pizza/formCercaPizza">Cerchi qualche pizza con un ingrediente particolare?</a>
		</h2>
		
		<div th:if="${pizze.isEmpty()}">Non ci sono pizze da gustare :(</div>
		<ul>
			<li th:each="pizza : ${pizze}" class="pizza-item">

    <div class="pizza-row">
        <!-- IMMAGINE -->
        <div class="pizza-img">
            <img th:src="${pizza.URLImmagine}" alt="Pizza" />
        </div>

        <!-- BLOCCO TESTO A DESTRA -->
        <div class="pizza-info">
            
            <!-- NOME + PREZZO + ICONE -->
            <div class="pizza-title">
                <a th:href="@{'/pizza' + '/' + ${pizza.id}}"
                   th:text="${pizza.nome} + ' (' + ${#numbers.formatDecimal(pizza.prezzo, 1, 2)} + '€)'">
                </a>

                <span class="celiaco" th:if="${pizza.isCeliaco()}">
                    <img src="/images/GlutenFree.jpg" />
                </span>
                <span class="vegano" th:if="${pizza.isVegan()}">
                    <img src="/images/Vegan_friendly_icon.jpg" />
                </span>
            </div>
            
            <!-- INGREDIENTI -->
            <div class="pizza-ingredients">
                <span class="ingrediente-pillola" th:each="ingrediente : ${pizza.listaIngredienti}"
                      th:text="${ingrediente.nome}">
                </span>
            </div>
        </div>
    </div>
    
    <!-- TESTO MEDIA STELLE -->
    <span th:if="${pizza.listaRecensioni.isEmpty()}"
          th:text="'Non esiste alcuna recensione'"
          class="pizza-voto">
    </span>

    <span th:unless="${pizza.listaRecensioni.isEmpty()}"
          th:text="${#numbers.formatDecimal(pizza.calcolaMediaStelle(), 1, 1)}"
          class="pizza-voto">
    </span>
    
    <!-- STELLE -->
    <div class="stelle" th:if="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}"
         th:with="media = ${pizza.calcolaMediaStelle()},
                  piene = ${(T(java.lang.Math).floor(media)).intValue()},
                  haMezza = ${(media - piene) >= 0.5},
                  mezza = ${haMezza ? 1 : 0},
                  vuote = ${5 - piene - mezza}">

        <img class="stella" src="/images/star-full.png"
             th:if="${piene > 0}"
             th:each="i : ${#numbers.sequence(1, piene)}"/>

        <img class="stella" src="/images/star-half.png" th:if="${haMezza}"/>

        <img class="stella" src="/images/star-empty.png"
             th:if="${vuote > 0}"
             th:each="i : ${#numbers.sequence(1, vuote)}"/>
    </div>
    
    <div class="stelle" th:unless="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}">
        <img class="stella" src="/images/star-empty.png"
             th:each="i : ${#numbers.sequence(1,5)}"/>
    </div>
</li>

		</ul>
	</body>
	
	
</html>
