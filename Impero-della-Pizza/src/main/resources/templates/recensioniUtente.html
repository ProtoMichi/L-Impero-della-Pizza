<!DOCTYPE html>
<html>
<head>
    <title>Recensioni di [[${utente.username}]]</title>
    <link rel="stylesheet" th:href="@{/css/pizza.css}" />
	<link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>
<body>

    <header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo" href="/">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
    </header>

    <h1 th:text="'Recensioni di '+ ${utente.username}">Username</h1>

    <div th:if="${recensioni.isEmpty()}">
        <p>Questo utente non ha ancora scritto recensioni.</p>
    </div>

    <ul th:unless="${recensioni.isEmpty()}">
        <li th:each="recensione : ${recensioni}">
            <p>
                <strong th:text="${recensione.pizza.nome}">Nome Pizza</strong>:
                <span th:text="${recensione.descrizione}">Descrizione</span>
                (<span th:text="${recensione.stelle}">5</span> stelle)
            </p>
        </li>
    </ul>

</body>
</html>
