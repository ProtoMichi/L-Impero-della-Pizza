<!DOCTYPE html>
<html>
<head>
  <title>Ingrediente</title>
</head>
<body>
	<header>
		<div th:if="${userDetails}">
			<span th:text="${userDetails.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
	</header>
	<div>
				<a href="/"><img src="/images/impero-della-pizza.png" width="5%" /></a>
			</div>
	
  <div th:if="${ingrediente}">
    <h1 th:text="${ingrediente.nome}">Nome Ingrediente</h1>
	<div>
	  Prezzo: <span th:text="${#numbers.formatDecimal(ingrediente.prezzo, 1, 2)} + ' €'">1.50 €</span>
	</div>
    <div th:if="${ingrediente.vegan}">
      <span>Adatto a vegani</span>
    </div>
    <div th:unless="${ingrediente.vegan}">
      <span>Non adatto a vegani</span>
    </div>
    <div th:if="${ingrediente.celiaco}">
      <span>Adatto a celiaci</span>
    </div>
    <div th:unless="${ingrediente.celiaco}">
      <span>Non adatto a celiaci</span>
    </div>
  </div>
  <div th:unless="${ingrediente}">
    Non Esiste
  </div>
</body>
</html>
