<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Modifica Ingrediente</title>
</head>
<body>
    <h1>Modifica Ingrediente</h1>
	<form th:action="@{'/ingrediente/' + ${ingrediente.id} + '/modifica'}" th:object="${ingrediente}" method="POST">
	    
	    <label for="nome">Nome:</label>
	    <input type="text" id="nome" th:field="*{nome}" required /><br />

	    <label for="prezzo">Prezzo:</label>
	    <input type="number" id="prezzo" th:field="*{prezzo}" step="0.01" min="0" required /><br />

	    <label for="celiaco">Celiaco:</label>
	    <input type="checkbox" id="celiaco" th:field="*{celiaco}" /><br />

	    <label for="vegano">Vegano:</label>
	    <input type="checkbox" id="vegano" th:field="*{vegan}" /><br />

	    <button type="submit">Salva modifiche</button>
	</form>
    <a href="/">Torna alla home</a>
</body>
</html>
