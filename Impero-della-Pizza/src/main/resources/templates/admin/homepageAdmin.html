<!DOCTYPE html>
<html>

<head>
	<title>
		Impero della Pizza - Homepage
	</title>
	<link rel="stylesheet" href="/css/admin/adminHome.css" />
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo" href="/">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>


	<section>
	<h1>Operazioni per amministratore</h1>
		<div>
		<a href="/admin/formNewIngrediente">Aggiungi un nuovo Ingrediente</a>
	</div>
	<div>
		<a href="/admin/gestisciPizze">Elimina Pizze</a>
	</div>
	<div>
		 <a href="/admin/formGestioneRecensioni">Elimina Recensioni</a>
	</div>
	</section>
</body>
</html>
