<!DOCTYPE html>
<html>
	<head>
  		<title>Aggiungi Ingrediente</title>
		<link rel="stylesheet" href="/css/admin/adminIngrediente.css">
		<link rel="stylesheet" href="/css/navbar.css">
	</head>
	<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>
	
	  <h1>Aggiungi un ingrediente</h1>
	  
	  <form th:action="@{/admin/ingrediente}" method="POST" th:object="${ingrediente}">
	<div class="nome">
		Nome: <span><input type="text" th:field="${ingrediente.nome}"/></span>
		<span th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
	</div>
	<div class="prezzo">
		Prezzo: <span><input type="number" min="0.05" step="0.05" th:field="${ingrediente.prezzo}"/></span>
		<span th:if="${#fields.hasErrors('prezzo')}" th:errors="*{prezzo}"></span>		
	</div>
	<div class="vegan">
		Vegan: <span><input type="checkbox" th:field="${ingrediente.vegan}"/></span>
	</div>
	<div class="celiaco">
	 Celiaco: 
	 <span><input type="checkbox" th:field="${ingrediente.celiaco}"/></span>
	</div>
	<div>
		<span><button type="submit">Conferma</button></span>
	</div>	
	  </form>	
	</body>
</html>
