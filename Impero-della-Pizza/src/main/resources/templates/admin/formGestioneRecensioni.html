<!DOCTYPE html>
<html>
	
<head>
	<title>Gestione Recensioni</title>
	<meta charset="UTF-8">
	<link rel="stylesheet" th:href="@{/css/recensione.css}" />
	<link rel="stylesheet" th:href="@{/css/navbar.css}">
</head>

<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo" href="/">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>

	<h1>Tutte le Recensioni</h1>

	<table border="1">
		<thead>
			<tr>
				<th>ID</th>
				<th>Pizza</th>
				<th>Descrizione</th>
				<th>Data</th>
				<th>Autore</th>
				<th>Stelle</th>
				<th>Dettagli</th>
			</tr>
		</thead>
		<tbody>
			<tr th:each="rec : ${recensioni}">
			                <td th:text="${rec.id}">1</td>
			                <td><a th:href="@{/pizza/{id}(id=${rec.pizza.id})}" th:text="${rec.pizza.nome}"></a></td>
			                <td th:text="${rec.descrizione}">Descrizione</td>
			                <td th:text="${rec.dataCreazione}">2024-04-01</td>
							<td> <a th:href="@{/recensione/{username}/recensioni(username=${rec.autore.username})}" th:text="${rec.autore.username}"></a></td>
			                <td th:text="${rec.stelle}">4.5</td>
			                <td><a th:href="@{/recensione/{id}(id=${rec.id})}">Visualizza</a></td>
				<td>
					<form th:action="@{/admin/gestioneRecensione/delete}" method="post"
						th:object="${rec}">
						<input type="hidden" name="id" th:value="${rec.id}" />
						<button type="submit"
							onclick="return confirm('Questa Recensione verrà eliminata per sempre, vuoi continuare lo stesso?');">Elimina</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
</body>
</html>
