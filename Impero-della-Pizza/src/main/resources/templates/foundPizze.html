<!DOCTYPE html>
<html>

<head>
	<title>Pizze Trovate</title>
	<link rel="stylesheet" href="/css/search.css" />
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<nav class="navbar">
		    <div class="nav-links">
		        <a class="logo">
		            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
		                height="70" width="70" class="logo">
		        </a>               
		        <a href="/pizza">Menù</a>
		        <a href="/ingrediente">Ingredienti</a>
		        <a href="/recensione">Recensioni</a>
		        <a href="/formNewPizza">Crea</a>
		        <a href="/pizza/formCercaPizza">Cerca</a>
				<!-- Blocco utente -->
				
					<div th:if="${userDetails}">
						<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
						<a href="/logout">Logout</a>
					</div>
					<div th:unless="${userDetails}">
						<a href="/login">Login</a>
					</div>
				</div>
		</nav>
	</header>
	
	<h1 th:text="'Pizze con ' + ${ingNome}"></h1>
	<div th:if="${trovate.isEmpty()}">Non ci sono pizze con questo ingrediente :(
		<br><a href="/pizza/formCercaPizza">Torna alla sezione di ricerca :)</a>
	</div>
	<ul th:if="${!trovate.isEmpty()}">
		<li th:each="pizza : ${trovate}">
			<a href="pizza.html" th:href="@{'/pizza' + '/' + ${pizza.id}}" th:text="${pizza.nome}"></a>
		</li>
	</ul>
</body>

</html>
