<!DOCTYPE html>
<html>

<head>
	<title>
		Unisciti all'Impero della Pizza! Registrati
	</title>
	<link rel="stylesheet" href="/css/stile.css" />
</head>

<body>
	<header>
		<div th:if="${dettagliUtente}">
			<span th:text="${dettagliUtente.username}"></span>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${utente}">
			<a href="/login">Login</a>
		</div>
	</header>

	<div>
		<a href="/"><img src="/images/impero-della-pizza.png" width="50%" /></a>
	</div>
	<h1>Registrazione nuovo utente</h1>
	<form th:action="@{/registrazione}" method="POST">
		<div>
			<label>Nome</label>
			<span><input type="text" placeholder="nome" required th:field="${utente.nome}" /></span>
			<span th:if="${#fields.hasErrors('utente.nome')}" th:errors="${utente.nome}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Cognome</label>
			<span><input type="text" placeholder="cognome" required th:field="${utente.cognome}" /></span>
			<span th:if="${#fields.hasErrors('utente.cognome')}" th:errors="${utente.cognome}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Email</label>
			<span><input type="text" placeholder="email" required th:field="${utente.email}" /></span>
			<span th:if="${#fields.hasErrors('utente.email')}" th:errors="${utente.email}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Username</label>
			<span>
				<input type="text" placeholder="username" required th:field="${credentials.username}" />
			</span>
			<span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Password</label>
			<span><input type="password" placeholder="password" required th:field="${credentials.password}" />
			</span>
			<span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<button type="submit">Registra</button>
		</div>
	</form>
</body>
</html>
