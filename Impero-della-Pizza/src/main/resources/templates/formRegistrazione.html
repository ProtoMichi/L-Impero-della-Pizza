<!DOCTYPE html>
<html>

<head>
	<title>
		Unisciti all'Impero della Pizza! Registrati!
	</title>
	<link rel="stylesheet" href="/css/register.css" />
	<link rel="stylesheet" href="/css/navbar.css">
</head>

<body>
	<header>
		<nav class="navbar">
					    <div class="nav-links">
					        <a class="logo" href="/">
					            <img src="/images/impero-della-pizza.png" alt="logo" title="Home"
					                height="70" width="70" class="logo">
					        </a>               
					        <a href="/pizza">Menù</a>
					        <a href="/ingrediente">Ingredienti</a>
					        <a href="/recensione">Recensioni</a>
					        <a href="/formNewPizza">Crea</a>
					        <a href="/pizza/formCercaPizza">Cerca</a>
							<!-- Blocco utente -->
							
								<div th:if="${userDetails}">
									<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
									<a href="/logout">Logout</a>
								</div>
								<div th:unless="${userDetails}">
									<a href="/login">Login</a>
								</div>
							</div>
					</nav>
	</header>

	<h1>Registrazione</h1>
	<form th:action="@{/registrazione}" method="POST">
		<div>
			<label>Nome</label>
			<span><input type="text" placeholder="nome" required th:field="${user.nome}" /></span>
			<span th:if="${#fields.hasErrors('user.nome')}" th:errors="${user.nome}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Cognome</label>
			<span><input type="text" placeholder="cognome" required th:field="${user.cognome}" /></span>
			<span th:if="${#fields.hasErrors('user.cognome')}" th:errors="${user.cognome}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Email</label>
			<span><input type="text" placeholder="email" required th:field="${user.email}" /></span>
			<span th:if="${#fields.hasErrors('user.email')}" th:errors="${user.email}" th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Username</label>
			<span>
				<input type="text" placeholder="username" required th:field="${credentials.username}" />
			</span>
			<span th:if="${#fields.hasErrors('credentials.username')}" th:errors="${credentials.username}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<label>Password</label>
			<span><input type="password" placeholder="password" required th:field="${credentials.password}" />
			</span>
			<span th:if="${#fields.hasErrors('credentials.password')}" th:errors="${credentials.password}"
				th:style="'color:red'">
			</span>
		</div>
		<div>
			<button type="submit">Registra</button>
		</div>
	</form>
</body>
</html>
