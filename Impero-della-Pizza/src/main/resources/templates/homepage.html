<!DOCTYPE html>

<html>
    <head>
        <meta charset="UTF-8">
        <link rel="icon" type="image/png" href="/images/logoPizza.png">
        <title>L'Impero della Pizza</title>
        <link rel="stylesheet" href="/css/home.css">
       
    </head>

    <body>
        <header>
			<nav class="navbar">
			    <div class="nav-links">
			        <a class="logo">
			            <img src="images/impero-della-pizza.png" alt="logo" title="Home"
			                height="70" width="70" class="logo">
			        </a>               
			        <a href="/pizza" style="text-decoration:none">Menù</a>
			        <a href="/ingrediente" style="text-decoration:none">Ingredienti</a>
			        <a href="/recensione" style="text-decoration:none">Recensioni</a>
			        <a href="/formNewPizza" style="text-decoration:none">Crea</a>
			        <a href="/pizza/formCercaPizza" style="text-decoration:none">Cerca</a>
					<!-- Blocco utente -->
					<div>
						<div th:if="${userDetails}">
							<span th:text="${userDetails.username}"></span>
							<a href="/logout">Logout</a>
						</div>
						<div th:unless="${userDetails}">
							<a href="/login">Login</a>
						</div>
					</div>
			    </div>
			</nav>

            <nav class="navbar">
                <div class="nav-links">
                    <a href="/"><img src="images/impero-della-pizza.png" alt="logo" title="Home"
                        height="70" width="70" class="logo">
                    </a>               
                    <a href="/pizza" style="text-decoration:none">Menù</a>
                    <a href="/ingrediente" style="text-decoration:none">Ingredienti</a>
                    <a href="/recensione" style="text-decoration:none">Recensioni</a>
                    <a href="/formNewPizza" style="text-decoration:none">Crea la tua Pizza</a>
                    <a href="/pizza/formCercaPizza" style="text-decoration:none">Cerca una Pizza</a>
                </div>
                <div th:if="${userDetails}">
                    <a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
                    <a href="/logout" style="text-decoration:none">Logout</a>
                </div>
                <div th:unless="${userDetails}">
                    <a href="/login" style="text-decoration:none">Login</a>
                </div>
            </nav>
        </header>

        <section class="richieste">
            <h1>Crea oggi stesso la tua pizza!</h1>

            <fieldset class="pizze-fieldset">
                <legend><h2 class="legend-title">Le più amate</h2></legend>

                <legend><h2>Le più amate</h2></legend>

                <div class="pizze">
                    <img src="/images/pizza-margherita.jpg" alt="Margherita">
                    <img src="/images/pizza-diavola.jpg" alt="Diavola">
                    <img src="/images/pizza-quattro-formaggi.jpg" alt="Boscaiola">
                </div>
            
        </section>

    </body>
</html>
