<!DOCTYPE html>
<html>
<head>
	<title>Pizza X</title>
	<link rel="stylesheet" th:href="@{/css/pizza.css}" />
</head>

<body>
	<header>
		<nav class="navbar">
			<div class="nav-links">
			                    <a class="logo"><img src="/images/impero-della-pizza.png" alt="logo" title="Home"
			                        height="70" width="70" class="logo">
			                    </a>               
			                    <a href="/pizza" style="text-decoration:none">Menù</a>
			                    <a href="/ingrediente" style="text-decoration:none">Ingredienti</a>
			                    <a href="/recensione" style="text-decoration:none">Recensioni</a>
			                    <a href="/formNewPizza" style="text-decoration:none">Crea</a>
			                    <a href="/pizza/formCercaPizza" style="text-decoration:none">Cerca</a>
		<div th:if="${userDetails}">
			<a class="username" th:href="@{'/recensione' + '/' + ${userDetails.username} + '/' + 'recensioni'}" th:text="${userDetails.username}"></a>
			<a href="/logout">Logout</a>
		</div>
		<div th:unless="${userDetails}">
			<a href="/login">Login</a>
		</div>
		</nav>
	</header>
	
	<div th:if="${pizza}">
		<h1> 
			<span th:text="${pizza.nome} + ' ' + ${#numbers.formatDecimal(pizza.prezzo, 1, 2)} + ' €' ">NomePizza</span>
		 	<span th:if="${pizza.isCeliaco()}"> <img class="checkbox" src="/images/GlutenFree.jpg" width="3%"/></span>
		 	<span th:if="${pizza.isVegan()}"> <img class="checkbox" src="/images/Vegan_friendly_icon.jpg" width="3%"/></span>
		</h1>
		<span><img width="30%" th:src="${pizza.URLImmagine}" /></span>
		<span><img th:if="${pizza.URLImmagine == ''}" src="https://media1.tenor.com/m/-mGE2cZvHAUAAAAd/pizza-time-food.gif"></span>
		<div class="stelle" th:if="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}"
			th:with="media = ${pizza.calcolaMediaStelle()},
    		piene = ${(T(java.lang.Math).floor(media)).intValue()},
    		haMezza = ${(media - piene) >= 0.5},
    		mezza = ${haMezza ? 1 : 0},
    		vuote = ${5 - piene - mezza}">    		
    		<img class="stellaPizza" src="/images/star-full.png" th:if="${piene > 0}" th:each="i : ${#numbers.sequence(1, piene)}"/>
    		<img class="stellaPizza" src="/images/star-half.png" th:if="${haMezza}"/>
    		<img class="stellaPizza" src="/images/star-empty.png" th:if="${vuote > 0}" th:each="i : ${#numbers.sequence(1, vuote)}"/>
		</div>
		<span th:text="${#numbers.formatDecimal(pizza.calcolaMediaStelle(), 1, 2)}" style="font-size: 2rem; color: #f1e4cd;
		 width: 100%; text-align: center; display: block; font-weight: bold;"></span>
		<div class="stelle" th:unless="${pizza.listaRecensioni != null and !pizza.listaRecensioni.isEmpty()}">
    		<span th:each="i : ${#numbers.sequence(1,5)}">
        		<img class="stellaPizza" src="/images/star-empty.png" width="25"/>
    		</span>
		</div>
	</div>
	<div th:unless="${pizza}">Non Esiste</div>
	<div th:if="${pizza.farina != null}">
		<h1>Ingredienti:</h1>
		<ul>
			<li th:if="${pizza.farina != null}" th:text="${pizza.farina.nome}">Nome
				farina</li>
			<li th:each="ingrediente : ${pizza.listaIngredienti}"><span
				th:text="${ingrediente.nome}">Nome ingrediente</span></li>
		</ul>
	</div>
	<h1>Recensioni</h1>
	<h2 th:if="${haGiaRecensito}">
	    Hai già lasciato una recensione, grazie mille!
	</h2>
	<h2 th:unless="${haGiaRecensito}">
	    <a th:href="@{'/pizza/' + ${pizza.id} + '/formNewRecensione'}">Aggiungi una recensione!</a>
	</h2>
	<div th:if="${pizza.listaRecensioni==null || pizza.listaRecensioni.isEmpty()}">Non ci sono recensioni per questa pizza</div>
		<ul>
			<li th:each="recensione : ${pizza.listaRecensioni}"
			    th:with="
			        valore=${recensione.stelle},
			        piene=${T(java.lang.Math).floor(valore).intValue()},
			        haMezza=${(valore - piene) >= 0.5},
			        mezza=${haMezza ? 1 : 0},
			        vuote=${5 - piene - mezza}">
			    
					
			    <!-- Stelle piene -->
			    <img class="stellaRecensione" src="/images/star-full.png"
			    	 th:if="${piene > 0}"
			         th:each="i : ${#numbers.sequence(1, piene)}" />

			    <!-- Mezza stella -->
			    <img class="stellaRecensione" src="/images/star-half.png"
			         th:if="${mezza == 1}" />

			    <!-- Stelle vuote -->
			    <img class="stellaRecensione" src="/images/star-empty.png"
			         th:if="${vuote > 0}"
			         th:each="i : ${#numbers.sequence(1, vuote)}" />
					 
					 <div>
					 	<span th:text="${recensione.descrizione}"></span><br/>
					    <small>Scritta da: <a th:href="@{/recensione/{username}/recensioni(username=${recensione.autore.username})}" th:text="${recensione.autore.username}">NomeUtente</a></small>
					 </div>

			</li>
		</ul>
</body>
</html>
